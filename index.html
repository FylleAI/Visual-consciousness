<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coscienza — simulazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #050309; color: #e8d9ff;
    font-family: 'Fraunces', serif;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .overlay {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 10;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: clamp(24px, 4vw, 56px);
  }
  .top {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 24px;
  }
  .header { display: flex; flex-direction: column; gap: 8px; max-width: 480px; }
  .title {
    font-family: 'Fraunces', serif;
    font-weight: 300; font-style: italic;
    font-size: clamp(28px, 4vw, 48px);
    letter-spacing: -0.02em; line-height: 1;
    color: #f4e8ff; opacity: 0.92;
  }
  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(232, 217, 255, 0.45);
    margin-top: 4px;
  }

  .nav {
    pointer-events: auto;
    display: flex; gap: 24px; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .nav a {
    color: rgba(232, 217, 255, 0.55);
    text-decoration: none;
    padding-bottom: 3px;
    border-bottom: 1px solid transparent;
    transition: color .25s, border-color .25s;
  }
  .nav a:hover { color: #f4e8ff; border-color: rgba(244, 232, 255, 0.4); }
  .nav a.current { color: #f4e8ff; border-color: hsl(45, 100%, 70%); }

  .footer {
    display: flex; justify-content: space-between;
    align-items: flex-end; gap: 24px; flex-wrap: wrap;
  }
  .legend {
    display: flex; gap: 24px; flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(232, 217, 255, 0.6);
  }
  .legend-item { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 12px 2px currentColor; }
  .line { width: 18px; height: 1px; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .dot.active { color: hsl(35, 100%, 65%); }
  .dot.memory { color: hsl(265, 80%, 65%); }
  .line.path { color: hsla(38, 100%, 70%, 0.7); }
  .line.synapse { color: hsla(45, 100%, 75%, 0.85); }

  .stats {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em;
    color: rgba(232, 217, 255, 0.5); line-height: 1.7;
  }
  .stats span { color: #f4e8ff; }

  .hint {
    position: fixed; bottom: 50%; left: 50%;
    transform: translate(-50%, 50%);
    font-family: 'Fraunces', serif;
    font-style: italic; font-weight: 300;
    font-size: 14px; color: rgba(232, 217, 255, 0.35);
    pointer-events: none;
    animation: breathe 3s ease-in-out infinite;
    z-index: 5;
  }
  .hint.hidden { opacity: 0; transition: opacity 1.2s; }
  @keyframes breathe {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.55; }
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(5, 3, 9, 0.7) 100%);
    z-index: 2;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>
  <div class="hint" id="hint">tocca lo spazio per stimolare un pensiero</div>

  <div class="overlay">
    <div class="top">
      <div class="header">
        <div class="title">coscienza</div>
        <div class="subtitle">il sistema evolve · le tracce restano</div>
      </div>
      <nav class="nav">
        <a href="index.html" class="current">simulazione</a>
        <a href="archivio.html">archivio</a>
        <a href="regole.html">regole</a>
      </nav>
    </div>
    <div class="footer">
      <div class="legend">
        <div class="legend-item"><span class="dot active"></span> impulso</div>
        <div class="legend-item"><span class="dot memory"></span> ricordo</div>
        <div class="legend-item"><span class="line path"></span> sentiero</div>
        <div class="legend-item"><span class="line synapse"></span> sinapsi</div>
      </div>
      <div class="stats">
        impulsi <span id="count-active">00</span><br />
        ricordi <span id="count-memory">000</span><br />
        sinapsi <span id="count-synapse">000</span>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const pathCanvas = document.createElement('canvas');
  const pathCtx = pathCanvas.getContext('2d');
  let W, H, DPR = window.devicePixelRatio || 1;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pathCanvas.width = W * DPR; pathCanvas.height = H * DPR;
    pathCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#050309'; ctx.fillRect(0, 0, W, H);
    pathCtx.clearRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);

  let neuronIdSeq = 0;
  class Neuron {
    constructor(x, y, opts = {}) {
      this.id = neuronIdSeq++;
      this.x = x; this.y = y; this.prevX = x; this.prevY = y;
      this.vx = 0; this.vy = 0;
      this.active = false;
      this.intensity = opts.intensity ?? (0.4 + Math.random() * 0.45);
      this.baseRadius = opts.radius ?? (1.6 + Math.random() * 2.4);
      this.radius = this.baseRadius;
      this.flash = 0; this.activations = 0;
      this.lastTouched = performance.now();
      this.driftPhase = Math.random() * Math.PI * 2;
      this.pulsePhase = Math.random() * Math.PI * 2;
      this.hue = 258 + Math.random() * 18;
    }
    activate(vx, vy) {
      this.active = true; this.vx = vx; this.vy = vy;
      this.flash = 1; this.prevX = this.x; this.prevY = this.y;
    }
    settle() { this.active = false; this.vx = 0; this.vy = 0; this.flash = 1; }
    reinforce() {
      this.activations++; this.lastTouched = performance.now();
      const k = 1 / (1 + this.activations * 0.25);
      this.intensity = Math.min(1, this.intensity + 0.08 * k);
      this.radius = Math.min(this.baseRadius * 2.4, this.radius + 0.18 * k);
      this.hue = Math.max(252, Math.min(282, this.hue + (Math.random() - 0.5) * 3));
    }
    decay() {
      this.intensity = Math.max(0.12, this.intensity - 0.0004);
      this.radius = Math.max(0.7, this.radius - 0.0012);
    }
  }

  let neurons = [];
  let connections = new Map();
  let collisions = [];
  const TARGET_DENSITY = 0.00009;
  const MAX_ACTIVE = 14;
  const MAX_NEURONS = 280;

  function connKey(a, b) { return a.id < b.id ? a.id + '_' + b.id : b.id + '_' + a.id; }
  function reinforceConnection(a, b) {
    const key = connKey(a, b);
    const c = connections.get(key);
    if (c) c.strength = Math.min(1.5, c.strength + 0.28);
    else connections.set(key, { a, b, strength: 0.45 });
  }

  function seed() {
    neurons = []; connections.clear();
    const count = Math.floor(W * H * TARGET_DENSITY);
    for (let i = 0; i < count; i++) {
      let x, y, ok = false, tries = 0;
      while (!ok && tries < 20) {
        x = Math.random() * W; y = Math.random() * H; ok = true;
        for (const n of neurons) {
          const dx = n.x - x, dy = n.y - y;
          if (dx * dx + dy * dy < 400) { ok = false; break; }
        }
        tries++;
      }
      neurons.push(new Neuron(x, y));
    }
    for (let i = 0; i < 4; i++) {
      const n = neurons[Math.floor(Math.random() * neurons.length)];
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.6 + Math.random() * 0.7;
      n.activate(Math.cos(angle) * speed, Math.sin(angle) * speed);
    }
  }

  function checkCollisions() {
    for (let i = 0; i < neurons.length; i++) {
      const a = neurons[i]; if (!a.active) continue;
      for (let j = 0; j < neurons.length; j++) {
        if (i === j) continue;
        const b = neurons[j]; if (b.active) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const minDist = a.radius + b.radius + 4;
        const d2 = dx * dx + dy * dy;
        if (d2 < minDist * minDist) {
          const dist = Math.sqrt(d2) || 1;
          const nx = dx / dist, ny = dy / dist;
          const speed = Math.hypot(a.vx, a.vy);
          const jitter = (Math.random() - 0.5) * 0.3;
          const cs = Math.cos(jitter), sn = Math.sin(jitter);
          const tnx = nx * cs - ny * sn;
          const tny = nx * sn + ny * cs;
          const newSpeed = Math.max(0.5, speed * (0.85 + Math.random() * 0.1));
          b.activate(tnx * newSpeed, tny * newSpeed);
          a.settle(); a.reinforce(); b.reinforce();
          reinforceConnection(a, b);
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          collisions.push({ x: mx, y: my, t: 0, life: 50, maxR: 18 + Math.random() * 14 });
          if (Math.random() < 0.05 && neurons.length < MAX_NEURONS) {
            const off = 6 + Math.random() * 10;
            const ang = Math.random() * Math.PI * 2;
            const baby = new Neuron(
              mx + Math.cos(ang) * off, my + Math.sin(ang) * off,
              { intensity: 0.3, radius: 1.2 + Math.random() * 0.6 }
            );
            baby.baseRadius = baby.radius;
            neurons.push(baby);
            connections.set(connKey(a, baby), { a, b: baby, strength: 0.3 });
            connections.set(connKey(b, baby), { a: b, b: baby, strength: 0.3 });
          }
          break;
        }
      }
    }
  }

  function activeCount() { let c = 0; for (const n of neurons) if (n.active) c++; return c; }

  function update(dt) {
    if (Math.random() < 0.008 && activeCount() < MAX_ACTIVE) {
      const memories = neurons.filter(n => !n.active);
      if (memories.length > 0) {
        let total = 0; for (const m of memories) total += m.intensity;
        let r = Math.random() * total; let pick = memories[0];
        for (const m of memories) { r -= m.intensity; if (r <= 0) { pick = m; break; } }
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.55 + Math.random() * 0.7;
        pick.activate(Math.cos(angle) * speed, Math.sin(angle) * speed);
      }
    }
    for (const n of neurons) {
      if (n.active) {
        n.prevX = n.x; n.prevY = n.y;
        n.x += n.vx * dt; n.y += n.vy * dt;
        if (n.x < n.radius) { n.x = n.radius; n.vx *= -1; }
        if (n.x > W - n.radius) { n.x = W - n.radius; n.vx *= -1; }
        if (n.y < n.radius) { n.y = n.radius; n.vy *= -1; }
        if (n.y > H - n.radius) { n.y = H - n.radius; n.vy *= -1; }
      } else {
        n.driftPhase += 0.003;
        n.pulsePhase += 0.012 + n.intensity * 0.005;
      }
      if (n.flash > 0) n.flash *= 0.88;
    }
    checkCollisions();
    const now = performance.now();
    for (let i = neurons.length - 1; i >= 0; i--) {
      const n = neurons[i]; if (n.active) continue;
      const idle = now - n.lastTouched;
      if (idle > 9000) n.decay();
      if (idle > 30000 && n.intensity <= 0.16 && Math.random() < 0.0015) {
        for (const key of [...connections.keys()]) {
          const c = connections.get(key);
          if (c.a.id === n.id || c.b.id === n.id) connections.delete(key);
        }
        neurons.splice(i, 1);
      }
    }
    for (const [key, c] of connections) {
      c.strength *= 0.9988;
      if (c.strength < 0.04) connections.delete(key);
    }
    for (const r of collisions) r.t += 1;
    collisions = collisions.filter(r => r.t < r.life);
  }

  function updatePathLayer() {
    pathCtx.globalCompositeOperation = 'destination-out';
    pathCtx.fillStyle = 'rgba(0,0,0,0.012)';
    pathCtx.fillRect(0, 0, W, H);
    pathCtx.globalCompositeOperation = 'source-over';
    for (const n of neurons) {
      if (!n.active) continue;
      const dx = n.x - n.prevX, dy = n.y - n.prevY;
      if (dx * dx + dy * dy < 0.01) continue;
      const grad = pathCtx.createLinearGradient(n.prevX, n.prevY, n.x, n.y);
      grad.addColorStop(0, `hsla(38, 100%, 70%, 0)`);
      grad.addColorStop(1, `hsla(45, 100%, 75%, ${0.32 * n.intensity})`);
      pathCtx.strokeStyle = grad;
      pathCtx.lineWidth = 0.7 + n.intensity * 0.6;
      pathCtx.lineCap = 'round';
      pathCtx.beginPath();
      pathCtx.moveTo(n.prevX, n.prevY);
      pathCtx.lineTo(n.x, n.y);
      pathCtx.stroke();
    }
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 3, 9, 0.22)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55;
    ctx.drawImage(pathCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    for (const c of connections.values()) {
      const s = c.strength; if (s < 0.06) continue;
      const a = c.a, b = c.b;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > 90000) continue;
      const alpha = Math.min(0.45, s * 0.32);
      const t = Math.min(1, s / 1.0);
      const hue = 270 - t * 230;
      const sat = 70 + t * 25;
      const light = 55 + t * 15;
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
      ctx.lineWidth = 0.4 + s * 0.9;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (const n of neurons) { if (!n.active) drawMemory(n); }
    for (const r of collisions) {
      const p = r.t / r.life;
      const radius = r.maxR * p;
      const alpha = (1 - p) * 0.4;
      ctx.beginPath(); ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(40, 100%, 70%, ${alpha})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
    for (const n of neurons) { if (n.active) drawActive(n); }
  }

  function drawMemory(n) {
    const pulse = 0.85 + Math.sin(n.pulsePhase) * 0.15;
    const r = n.radius * pulse;
    const alpha = 0.5 + n.intensity * 0.35;
    const h = n.hue;
    const gOut = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 5);
    gOut.addColorStop(0, `hsla(${h}, 75%, 65%, ${alpha * 0.45})`);
    gOut.addColorStop(0.5, `hsla(${h - 5}, 70%, 50%, ${alpha * 0.12})`);
    gOut.addColorStop(1, `hsla(${h - 8}, 70%, 50%, 0)`);
    ctx.fillStyle = gOut;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 5, 0, Math.PI * 2); ctx.fill();
    const gCore = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 1.6);
    gCore.addColorStop(0, `hsla(${h + 5}, 90%, 88%, ${alpha + 0.2})`);
    gCore.addColorStop(0.4, `hsla(${h}, 80%, 70%, ${alpha})`);
    gCore.addColorStop(1, `hsla(${h - 8}, 70%, 45%, 0)`);
    ctx.fillStyle = gCore;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
    if (n.flash > 0.05) {
      ctx.fillStyle = `hsla(45, 100%, 90%, ${n.flash * 0.6})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, r * (1 + n.flash * 2), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawActive(n) {
    const r = n.radius * 1.15;
    const i = n.intensity;
    const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 8);
    halo.addColorStop(0, `hsla(40, 100%, 75%, ${0.28 + i * 0.25})`);
    halo.addColorStop(0.4, `hsla(28, 100%, 55%, ${0.08 + i * 0.08})`);
    halo.addColorStop(1, 'hsla(15, 100%, 40%, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 8, 0, Math.PI * 2); ctx.fill();
    const mid = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 3);
    mid.addColorStop(0, `hsla(48, 100%, 92%, ${0.7 + i * 0.3})`);
    mid.addColorStop(0.5, `hsla(35, 100%, 65%, 0.45)`);
    mid.addColorStop(1, 'hsla(20, 100%, 50%, 0)');
    ctx.fillStyle = mid;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsla(50, 100%, 97%, ${0.9 + i * 0.1})`;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.85, 0, Math.PI * 2); ctx.fill();
    if (n.flash > 0.05) {
      ctx.fillStyle = `hsla(50, 100%, 98%, ${n.flash * 0.7})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, r * (1.5 + n.flash * 3), 0, Math.PI * 2); ctx.fill();
    }
  }

  let hintHidden = false;
  function spawnAt(x, y) {
    let nearest = null, bestD = Infinity;
    for (const n of neurons) {
      if (n.active) continue;
      const dx = n.x - x, dy = n.y - y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; nearest = n; }
    }
    if (nearest && bestD < 22500) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.7 + Math.random() * 0.6;
      nearest.activate(Math.cos(angle) * speed, Math.sin(angle) * speed);
      nearest.reinforce();
    } else if (neurons.length < MAX_NEURONS) {
      const n = new Neuron(x, y);
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.7 + Math.random() * 0.6;
      n.activate(Math.cos(angle) * speed, Math.sin(angle) * speed);
      neurons.push(n);
    }
    if (!hintHidden) {
      document.getElementById('hint').classList.add('hidden');
      hintHidden = true;
    }
  }
  canvas.addEventListener('pointerdown', (e) => spawnAt(e.clientX, e.clientY));
  canvas.addEventListener('pointermove', (e) => {
    if (e.buttons === 1) spawnAt(e.clientX, e.clientY);
  });

  const elActive = document.getElementById('count-active');
  const elMemory = document.getElementById('count-memory');
  const elSyn = document.getElementById('count-synapse');
  let lastUI = 0;
  function updateUI(t) {
    if (t - lastUI < 200) return;
    lastUI = t;
    let a = 0, m = 0;
    for (const n of neurons) n.active ? a++ : m++;
    elActive.textContent = String(a).padStart(2, '0');
    elMemory.textContent = String(m).padStart(3, '0');
    elSyn.textContent = String(connections.size).padStart(3, '0');
  }

  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min(2.5, (t - lastT) / 16.67);
    lastT = t;
    update(dt); updatePathLayer(); render(); updateUI(t);
    requestAnimationFrame(loop);
  }
  resize(); seed(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
